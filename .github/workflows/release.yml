name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Validate Distributions
    runs-on: macos-14
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release tag and package versions
        id: release_meta
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          ref_name = os.environ["GITHUB_REF_NAME"]
          if not ref_name.startswith("v"):
              raise SystemExit(f"Release tags must start with 'v': {ref_name}")

          tag_version = ref_name[1:]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          project_version = pyproject["project"]["version"]

          namespace = {}
          exec(Path("src/termviz/__init__.py").read_text(), namespace)
          package_version = namespace["__version__"]

          versions = {
              "git tag": tag_version,
              "pyproject.toml": project_version,
              "termviz.__version__": package_version,
          }
          if len(set(versions.values())) != 1:
              details = ", ".join(f"{name}={value}" for name, value in versions.items())
              raise SystemExit(f"Release version mismatch: {details}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={tag_version}\n")
          PY

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install blessed click numpy pytest build twine

      - name: Run Python tests
        env:
          PYTHONPATH: src
        run: pytest

      - name: Run Swift helper tests
        working-directory: termviz_helper
        run: swift test

      - name: Build distributions
        run: |
          rm -rf build dist
          python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Smoke test built wheel
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          python -m venv /tmp/termviz-wheel-smoke
          /tmp/termviz-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/termviz-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/termviz-wheel-smoke/bin/termviz --version | tee /tmp/termviz-version.txt
          grep -q "version ${VERSION}$" /tmp/termviz-version.txt
          /tmp/termviz-wheel-smoke/bin/python - <<'PY'
          import importlib.resources as resources

          helper = resources.files("termviz") / "helper" / "termviz-helper.app" / "Contents" / "MacOS" / "termviz-helper"
          if not helper.is_file():
              raise SystemExit(f"Bundled helper missing from wheel install: {helper}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi-install:
    name: Verify TestPyPI Install
    needs:
      - build
      - publish-to-testpypi
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install published wheel from TestPyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          for attempt in $(seq 1 10); do
            if python -m pip install --no-cache-dir --only-binary=:all: --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "termviz==${VERSION}"; then
              exit 0
            fi
            if [ "${attempt}" -eq 10 ]; then
              echo "termviz ${VERSION} did not become installable from TestPyPI in time" >&2
              exit 1
            fi
            sleep 30
          done

      - name: Verify installed version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          termviz --version | tee /tmp/termviz-version.txt
          grep -q "version ${VERSION}$" /tmp/termviz-version.txt

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build
      - verify-testpypi-install
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
